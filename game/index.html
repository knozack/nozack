 <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f9fafb" />
  <title>BLT.STREAM</title>
  <style>
    :root { color-scheme: light; }

    html, body {
      margin: 0;
      height: 100%;
      background:#f9fafb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #0a0a0a;
    }
    body { overscroll-behavior: none; }

    #wrap {
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px;
      box-sizing:border-box;
    }

    canvas{
      width:min(920px, 100%);
      height:min(700px, calc(100vh - 20px));
      display:block;
      border-radius:16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.10);
      background: #f9fafb;
      touch-action: manipulation;
    }

    .hud{
      position: fixed; top: 12px; left: 12px; right: 12px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
      pointer-events:none;
    }

    .pill{
      pointer-events:none;
      padding:10px 12px;
      border-radius:999px;
      background: rgba(10,10,10,0.04);
      border: 1px solid rgba(10,10,10,0.10);
      backdrop-filter: blur(10px);
      color: rgba(10,10,10,0.88);
      font-size: 14px;
      display:flex; gap:10px; align-items:center;
    }

    .muted{ color: rgba(10,10,10,0.55); }
    .kbd{
      padding: 2px 6px; border-radius: 8px;
      border:1px solid rgba(10,10,10,0.18);
      background: rgba(10,10,10,0.04);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: rgba(10,10,10,0.74);
    }

    /* UI that needs pointer events */
    .ui{
      pointer-events:auto;
      display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; justify-content:flex-end;
    }

    input[type="text"]{
      width: 160px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(10,10,10,0.16);
      background: rgba(255,255,255,0.92);
      color: rgba(10,10,10,0.90);
      outline: none;
    }
    input[type="text"]:focus{
      border-color: rgba(0,145,255,0.55);
      box-shadow: 0 0 0 3px rgba(0,145,255,0.12);
    }

    button{
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(10,10,10,0.16);
      background: rgba(255,255,255,0.92);
      color: rgba(10,10,10,0.84);
      cursor: pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover{ background: rgba(255,255,255,1); }

    .err { font-size: 12px; color: rgba(210,60,60,0.92); padding-left: 10px; }
    .ok  { font-size: 12px; color: rgba(0,140,90,0.92); padding-left: 10px; }

    /* Modal */
    .modalBackdrop{
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.22);
      display:none;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      padding: 12px;
      box-sizing:border-box;
    }
    .modal{
      width: min(760px, calc(100vw - 24px));
      max-height: min(560px, calc(100vh - 24px));
      overflow:auto;
      background: rgba(249,250,251,0.96);
      border: 1px solid rgba(10,10,10,0.12);
      border-radius: 18px;
      box-shadow: 0 18px 70px rgba(0,0,0,0.12);
      padding: 16px;
      color: rgba(10,10,10,0.90);
    }
    .row{
      display:flex; justify-content:space-between; gap:10px;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(10,10,10,0.08);
    }
    .row:last-child{ border-bottom:none; }
    .small{ font-size: 12px; color: rgba(10,10,10,0.62); }

    .tabs{ display:flex; gap:8px; margin-top:10px; }
    .tab{
      pointer-events:auto;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(10,10,10,0.14);
      background: rgba(10,10,10,0.04);
      color: rgba(10,10,10,0.82);
      font-size: 12px;
      cursor:pointer;
      user-select:none;
    }
    .tab--active{
      background: rgba(0,145,255,0.10);
      border-color: rgba(0,145,255,0.22);
      color: rgba(10,10,10,0.90);
    }
  </style>
</head>

<body>
  <div class="hud">
    <div class="pill">
      <strong>BLT.STREAM</strong>
      <span class="muted">tap/click or</span>
      <span class="kbd">Space</span>
      <span class="muted">to drop or start again</span>
    </div>

    <div class="ui">
      <div class="pill">
        <span class="muted">Height</span> <strong id="score">0</strong>
        <span class="muted">• Best</span> <strong id="best">0</strong>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <input id="name" type="text" maxlength="24" aria-label="Username" />
        <div id="nameErr" class="err" style="display:none;"></div>
        <div id="nameOk" class="ok" style="display:none;"></div>
      </div>

      <button id="muteBtn" title="Sound on/off">Sound: On</button>
      <button id="lbBtn" title="Leaderboards">Leaderboards</button>
    </div>
  </div>

  <div id="wrap">
    <canvas id="c" width="920" height="700"></canvas>
  </div>

  <div class="modalBackdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div>
          <div style="font-weight:700; font-size:18px;">Leaderboards</div>
          <div class="small" id="lbHint">Loading…</div>
          <div class="tabs">
            <div class="tab tab--active" id="tabWeekly">Weekly</div>
            <div class="tab" id="tabAll">All-time</div>
          </div>
        </div>
        <button id="closeModal">Close</button>
      </div>

      <div id="lbList" style="margin-top:10px;"></div>

      <div style="margin-top:12px;" class="small">
        One score per username (best score wins). If you clear browser storage, your generated name may reset.
      </div>
    </div>
  </div>

<script>
(() => {
  document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

  // --- Theme constants (your requested palette) ---
  const BG = '#f9fafb';
  const GRID = '#d6dbe3';
  const BLUE_1 = '#00b7ff'; // <= 20
  const BLUE_2 = '#0091ff'; // >= 21
  const RADIUS = 14;

  // --- Canvas setup ---
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Keep stable DPR so overlay sizing is consistent across browsers (Safari fix)
  let DPR = 1;

  const isMobile = window.matchMedia && window.matchMedia('(max-width: 560px)').matches;

  function fitCanvasToCSS(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const rect = canvas.getBoundingClientRect();
    const w = Math.round(rect.width * DPR);
    const h = Math.round(rect.height * DPR);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    // Draw everything in CSS pixel units
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', fitCanvasToCSS, { passive: true });

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  // UI
  const nameInput = document.getElementById('name');
  const nameErr   = document.getElementById('nameErr');
  const nameOk    = document.getElementById('nameOk');
  const muteBtn   = document.getElementById('muteBtn');
  const lbBtn     = document.getElementById('lbBtn');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const closeModal    = document.getElementById('closeModal');
  const lbList = document.getElementById('lbList');
  const lbHint = document.getElementById('lbHint');
  const tabWeekly = document.getElementById('tabWeekly');
  const tabAll    = document.getElementById('tabAll');

  function setNameError(msg){
    nameOk.style.display = 'none'; nameOk.textContent = '';
    if (!msg) { nameErr.style.display = 'none'; nameErr.textContent = ''; return; }
    nameErr.textContent = msg;
    nameErr.style.display = 'block';
  }
  function setNameOk(msg){
    nameErr.style.display = 'none'; nameErr.textContent = '';
    if (!msg) { nameOk.style.display = 'none'; nameOk.textContent = ''; return; }
    nameOk.textContent = msg;
    nameOk.style.display = 'block';
  }

  // --- Shared leaderboard (Cloudflare Pages Functions) ---
  const API_BASE = ""; // same-origin
  const ENDPOINT_SCORE = API_BASE + "/api/score";
  const ENDPOINT_LEADERBOARD = API_BASE + "/api/leaderboard";

  // Stable per-device player_id
  const playerId = localStorage.getItem('blt_player_id') ||
    (crypto.randomUUID ? crypto.randomUUID() : `p_${Math.random().toString(16).slice(2)}${Date.now()}`);
  localStorage.setItem('blt_player_id', playerId);

  // --- Sound ---
  let audioEnabled = (localStorage.getItem('blt_sound') ?? 'on') === 'on';
  muteBtn.textContent = audioEnabled ? 'Sound: On' : 'Sound: Off';

  let audioCtx = null;
  function ensureAudio(){
    if (!audioEnabled) return false;
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return true;
  }
  function beep({freq=440, dur=0.04, type='sine', gain=0.03, attack=0.002, release=0.03} = {}){
    if (!ensureAudio()) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + release + 0.02);
  }
  function thud(intensity=1){
    const f = 110 + Math.random()*18;
    beep({freq:f, dur:0.035, type:'sine', gain:0.035*intensity});
    beep({freq:f*0.5, dur:0.05, type:'triangle', gain:0.02*intensity});
  }
  function whoosh(){
    if (!ensureAudio()) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(260 + Math.random()*80, t0);
    o.frequency.exponentialRampToValueAtTime(120, t0 + 0.08);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.015, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + 0.12);
  }

  muteBtn.addEventListener('click', () => {
    audioEnabled = !audioEnabled;
    localStorage.setItem('blt_sound', audioEnabled ? 'on' : 'off');
    muteBtn.textContent = audioEnabled ? 'Sound: On' : 'Sound: Off';
    if (audioEnabled) { ensureAudio(); beep({freq:520, dur:0.03, gain:0.02}); }
  });

  // --- Game constants ---
  const LOGICAL_W = 920;
  const LOGICAL_H = 700;

  let W = LOGICAL_W;
  let H = LOGICAL_H;

  function beginScene(){
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    const sx = W / LOGICAL_W;
    const sy = H / LOGICAL_H;
    const baseScale = Math.min(sx, sy);

    // keep your “fill more of screen” boost on mobile
    const s = isMobile ? (baseScale * 1.20) : baseScale;

    const ox = (W - LOGICAL_W*s) / 2;
    const oy = (H - LOGICAL_H*s) / 2;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(s, s);
  }
  function endScene(){ ctx.restore(); }

  const GROUND_Y = LOGICAL_H - 70;
  const SLAB_H   = 26;
  const GRAVITY  = 2400;

  const BASE_SPEED = 220;
  const SPEED_GAIN = 9.5;
  const MAX_SPEED  = 980;
  const ERRATIC_START_AT = 8;
  const ERRATIC_GAIN     = 5.5;

  const CAM_SMOOTH   = 0.16;
  const VIEW_TARGET_Y = 170;

  // --- State ---
  let stack = [];
  let current = null;
  let cam = 0;
  let score = 0;
  let best = Number(localStorage.getItem('blt_best') || '0');
  bestEl.textContent = best;

  // --- Utils ---
  const rand  = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function hexToRgb(hex){
    const h = hex.replace('#','').trim();
    const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }
  function rgba(hex, a){
    const {r,g,b} = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }
  function darken(hex, amount=0.18){
    const {r,g,b} = hexToRgb(hex);
    const k = (x)=> Math.max(0, Math.min(255, Math.round(x*(1-amount))));
    const rr = k(r), gg = k(g), bb = k(b);
    return `rgb(${rr},${gg},${bb})`;
  }

  // --- Username ---
  function genName(){
    const a = ['Steel','Glass','Concrete','Plumb','Beam','Bolt','Crane','Facade','Atrium','Lintel','Girder','Sill','Panel','Truss'];
    const b = ['Fox','Hawk','Otter','Lynx','Heron','Wolf','Koi','Raven','Cobra','Mantis','Puma','Orca'];
    return `${a[Math.floor(Math.random()*a.length)]}${b[Math.floor(Math.random()*b.length)]}${Math.floor(rand(10,99))}`;
  }

  const savedName = localStorage.getItem('blt_name') || genName();
  nameInput.value = savedName;

  function normalizeName(v){
    v = String(v || '').trim().replace(/\s+/g, ' ');
    if (v.length > 24) v = v.slice(0,24);
    return v;
  }

  // Prevent typing in the name field from controlling the game
  nameInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
  }, { passive: false });

  nameInput.addEventListener('change', () => {
    let v = normalizeName(nameInput.value);
    if (!v) v = genName();
    nameInput.value = v;
    localStorage.setItem('blt_name', v);
    setNameError('');
    setNameOk('');
  });

  // --- Leaderboard API ---
  async function submitScore(username, score){
    const res = await fetch(ENDPOINT_SCORE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, score, player_id: playerId })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = data?.error || "Submit failed";
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function fetchLeaderboards(limit = 25){
    const res = await fetch(`${ENDPOINT_LEADERBOARD}?limit=${encodeURIComponent(limit)}`, { method: "GET" });
    if (!res.ok) throw new Error("Leaderboard fetch failed");
    return await res.json();
  }

  // --- Modal render ---
  let lbMode = "weekly";
  let cachedLB = null;

  function setTabUI(){
    tabWeekly.classList.toggle('tab--active', lbMode === 'weekly');
    tabAll.classList.toggle('tab--active', lbMode === 'all');
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"]+/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));
  }

  function renderList(entries){
    lbList.innerHTML = '';
    if (!entries || !entries.length) {
      lbList.innerHTML = `<div class="small" style="padding:12px 4px;">No scores yet. Play a round!</div>`;
      return;
    }
    const me = normalizeName(nameInput.value);
    entries.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      const left = document.createElement('div');
      const isMe = (normalizeName(r.username) === me);
      left.innerHTML = `<strong>#${i+1}</strong> <span style="margin-left:8px;${isMe?'color:rgba(10,10,10,0.92)':''}">${escapeHtml(r.username)}</span>`;
      const right = document.createElement('div');
      right.innerHTML = `<strong>${r.score}</strong>`;
      row.appendChild(left);
      row.appendChild(right);
      lbList.appendChild(row);
    });
  }

  async function openLeaderboard(){
    modalBackdrop.style.display = 'flex';
    lbHint.textContent = 'Loading…';
    lbList.innerHTML = '';
    setTabUI();

    try {
      cachedLB = await fetchLeaderboards(50);
      lbHint.textContent = `Weekly resets Monday 00:00 UTC • Week key: ${cachedLB.week_key}`;
      const list = (lbMode === 'weekly') ? cachedLB.weekly : cachedLB.alltime;
      renderList(list);
    } catch {
      lbHint.textContent = 'Error loading leaderboards.';
      renderList([]);
    }
  }

  lbBtn.addEventListener('click', openLeaderboard);
  closeModal.addEventListener('click', () => { modalBackdrop.style.display = 'none'; });
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) modalBackdrop.style.display = 'none';
  });

  tabWeekly.addEventListener('click', () => {
    lbMode = 'weekly'; setTabUI();
    if (cachedLB) renderList(cachedLB.weekly);
  });
  tabAll.addEventListener('click', () => {
    lbMode = 'all'; setTabUI();
    if (cachedLB) renderList(cachedLB.alltime);
  });

  // --- Game ---
  function reset() {
    setNameError('');
    setNameOk('');
    score = 0;
    scoreEl.textContent = score;

    stack = [];
    cam = 0;

    const baseW = 360;
    stack.push({ x: (LOGICAL_W - baseW)/2, y: GROUND_Y, w: baseW, h: SLAB_H, level: 0 });

    spawnNextSlab();
  }

  function spawnNextSlab() {
    const top = stack[stack.length - 1];
    const w = top.w;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const startX = dir === 1 ? -w - 40 : LOGICAL_W + 40;
    const y = top.y - SLAB_H;

    const baseAt20 = BASE_SPEED + SPEED_GAIN * 20;
    const base = (score < 20)
      ? (BASE_SPEED + SPEED_GAIN * score)
      : (baseAt20 * 0.5 + SPEED_GAIN * (score - 20));

    current = {
      x: startX, y, w, h: SLAB_H,
      level: score + 1,
      vx: dir * clamp(base, 120, MAX_SPEED),
      vy: 0,
      state: 'moving',
      t: 0,
      jitterStrength: score < ERRATIC_START_AT ? 0 : (score - ERRATIC_START_AT + 1) * ERRATIC_GAIN,
      jitterFreq: rand(1.1, 2.4),
      jitterPhase: rand(0, Math.PI*2)
    };

    whoosh();
  }

  function drop() {
    if (!current) return;
    ensureAudio();

    if (current.state === 'moving') {
      current.state = 'dropping';
      current.vy = 0;
      beep({freq: 520 + Math.random()*40, dur:0.02, gain:0.02, type:'sine'});
    } else if (current.state === 'gameover') {
      reset();
      beep({freq: 520, dur:0.02, gain:0.02});
    }
  }

  async function gameOver() {
    current.state = 'gameover';
    thud(0.8);

    if (score > best) {
      best = score;
      localStorage.setItem('blt_best', String(best));
      bestEl.textContent = best;
    }

    let username = normalizeName(nameInput.value);
    if (!username) username = genName();
    nameInput.value = username;
    localStorage.setItem('blt_name', username);

    // Don’t submit zero scores
    if (score === 0) {
      setNameOk('');
      return;
    }

    // Auto-submit score to shared leaderboard
    try {
      const data = await submitScore(username, score);

      const wk = data.rank_weekly ? `Weekly #${data.rank_weekly}` : null;
      const at = data.rank_alltime ? `All-time #${data.rank_alltime}` : null;
      const msg = [wk, at].filter(Boolean).join(' • ');
      if (msg) setNameOk(msg);
      else setNameOk('Score submitted.');

      cachedLB = null;
    } catch (e) {
      if (e?.status === 409) setNameError('Username not available');
      else setNameError(e?.message || 'Could not submit score');
    }
  }

  function intersect1D(a0, a1, b0, b1) {
    const lo = Math.max(a0, b0);
    const hi = Math.min(a1, b1);
    return hi > lo ? { lo, hi, w: hi - lo } : null;
  }

  const debris = [];

  // --- Celebration (Level 20) ---
  let celebrateUntil = 0;
  const fireworks = [];

  function launchFireworks(y){
    // multi-color on white bg
    const colors = [
      '#ff4d6d', '#ffb703', '#00b7ff', '#0091ff',
      '#7c5cff', '#2dd4bf', '#22c55e', '#f97316'
    ];

    const bursts = isMobile ? 14 : 10;
    const particlesPerBurst = isMobile ? 40 : 26;

    for (let b = 0; b < bursts; b++) {
      const cx = rand(90, LOGICAL_W-90);
      const cy = y - rand(80, 210);
      const base = colors[Math.floor(Math.random()*colors.length)];

      for (let i = 0; i < particlesPerBurst; i++) {
        const a = rand(0, Math.PI*2);
        const sp = isMobile ? rand(240, 620) : rand(160, 420);
        const lift = isMobile ? rand(140, 300) : rand(90, 210);
        const life = isMobile ? rand(1.05, 1.85) : rand(0.8, 1.3);

        fireworks.push({
          x: cx, y: cy,
          vx: Math.cos(a)*sp,
          vy: Math.sin(a)*sp - lift,
          life,
          color: base
        });
      }
    }
  }

  function drawFireworks(){
    if (!fireworks.length) return;

    const r = isMobile ? 3.4 : 2.4;

    ctx.save();
    for (const f of fireworks) {
      const a = clamp(f.life, 0, 1);
      ctx.globalAlpha = a;

      ctx.fillStyle = rgba(f.color, 0.95);
      ctx.beginPath();
      ctx.arc(f.x, f.y, r, 0, Math.PI*2);
      ctx.fill();

      // tail
      ctx.globalAlpha = a * 0.50;
      ctx.strokeStyle = rgba(f.color, 0.85);
      ctx.lineWidth = 1;

      const tail = isMobile ? 0.024 : 0.016;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x - f.vx * tail, f.y - f.vy * tail);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function spawnDebris(cur, ov) {
    const leftOverhang = Math.max(0, ov.lo - cur.x);
    if (leftOverhang > 2) {
      debris.push({ x: cur.x + leftOverhang/2, y: cur.y + cur.h/2, w: leftOverhang, h: cur.h, vx: -rand(40, 140), vy: -rand(220, 520), life: 1.0 });
    }
    const rightOverhang = Math.max(0, (cur.x + cur.w) - ov.hi);
    if (rightOverhang > 2) {
      debris.push({ x: ov.hi + rightOverhang/2, y: cur.y + cur.h/2, w: rightOverhang, h: cur.h, vx: rand(40, 140), vy: -rand(220, 520), life: 1.0 });
    }
  }

  function resolveLanding() {
    const prev = stack[stack.length - 1];
    const ov = intersect1D(current.x, current.x + current.w, prev.x, prev.x + prev.w);
    if (!ov) { gameOver(); return; }

    spawnDebris(current, ov);

    const newSlab = { x: ov.lo, y: prev.y - SLAB_H, w: ov.w, h: SLAB_H };
    stack.push(newSlab);

    score++;
    scoreEl.textContent = score;

    if (score === 20) {
      celebrateUntil = performance.now() + (isMobile ? 2400 : 1800);
      launchFireworks(newSlab.y);
      beep({freq: 660, dur:0.05, gain:0.03});
      beep({freq: 880, dur:0.06, gain:0.02});
      if (isMobile) beep({freq: 990, dur:0.05, gain:0.02});
    }

    const quality = clamp(ov.w / prev.w, 0, 1);
    thud(0.6 + 0.7*quality);

    spawnNextSlab();
  }

  // Input
  window.addEventListener('keydown', (e) => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;

    if (e.code === 'Space') { e.preventDefault(); drop(); }
    if (e.key.toLowerCase() === 'r') reset();
  }, { passive: false });

  canvas.addEventListener('pointerdown', () => drop(), { passive: true });

  // Update + Render
  let last = performance.now();

  function update(dt) {
    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy += GRAVITY * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.life -= dt * 0.9;
      if (d.life <= 0 || d.y > LOGICAL_H + 400) debris.splice(i, 1);
    }

    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i];
      f.vy += (GRAVITY * 0.45) * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.life -= dt;
      if (f.life <= 0) fireworks.splice(i, 1);
    }

    if (!current) return;

    current.t += dt;

    if (current.state === 'moving') {
      current.x += current.vx * dt;

      const baseAt20 = BASE_SPEED + SPEED_GAIN * 20;
      const base = (score < 20)
        ? (BASE_SPEED + SPEED_GAIN * score)
        : (baseAt20 * 0.5 + SPEED_GAIN * (score - 20));
      const max = clamp(base + 420 + score*8, 300, MAX_SPEED);

      const sinBias = Math.sin(current.t * current.jitterFreq + current.jitterPhase) * current.jitterStrength;
      const walk = rand(-1, 1) * current.jitterStrength * 0.9;

      current.vx += (sinBias + walk) * dt;
      current.vx = clamp(current.vx, -max, max);

      if (current.x < -current.w - 80) {
        current.x = -current.w - 80;
        current.vx = Math.abs(current.vx) * rand(0.85, 1.08);
      }
      if (current.x > LOGICAL_W + 80) {
        current.x = LOGICAL_W + 80;
        current.vx = -Math.abs(current.vx) * rand(0.85, 1.08);
      }
    } else if (current.state === 'dropping') {
      current.vy += GRAVITY * dt;
      current.y += current.vy * dt;

      const top = stack[stack.length - 1];
      const landingY = top.y - SLAB_H;
      if (current.y >= landingY) {
        current.y = landingY;
        resolveLanding();
      }
    }

    const focusY = current ? current.y : (stack[stack.length-1]?.y ?? GROUND_Y);
    const desired = (VIEW_TARGET_Y - focusY);
    cam += (desired - cam) * CAM_SMOOTH;
  }

  // Rounded rect helper
  function roundRectPath(x, y, w, h, r){
    const rr = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    // fill background (consistent on all browsers)
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.restore();

    beginScene();
    ctx.save();
    ctx.translate(0, cam);

    drawGrid();

    // ground marker (subtle)
    ctx.fillStyle = rgba(GRID, 0.40);
    ctx.fillRect(0, GROUND_Y + SLAB_H, LOGICAL_W, 3);

    for (let i = 0; i < stack.length; i++) {
      const s = stack[i];
      drawSlab(s.x, s.y, s.w, s.h, 1, s.level || 0);
    }

    for (const d of debris) {
      ctx.globalAlpha = clamp(d.life, 0, 1) * 0.75;
      drawSlab(d.x - d.w/2, d.y - d.h/2, d.w, d.h, 1, 0);
      ctx.globalAlpha = 1;
    }

    if (current && current.state !== 'gameover') {
      drawSlab(current.x, current.y, current.w, current.h, 1, current.level || 0);
    }

    // fireworks (scene space)
    drawFireworks();

    ctx.restore();
    endScene();

    // --- Overlays (draw in CSS pixels, DPR-aware) ---
    const nowMs = performance.now();

    // A gentle “fade grid behind overlays” treatment:
    // we draw a semi-opaque BG wash instead of a harsh dark veil.
    function overlayWash(alpha){
      ctx.save();
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const r2 = canvas.getBoundingClientRect();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = rgba(BG, 1); // use BG color, alpha via globalAlpha
      ctx.fillRect(0, 0, r2.width, r2.height);
      ctx.restore();
    }

    if (nowMs < celebrateUntil) {
      overlayWash(0.55);

      ctx.save();
      ctx.setTransform(DPR,0,0,DPR,0,0);

      const rect2 = canvas.getBoundingClientRect();
      const t = 1 - ((celebrateUntil - nowMs) / (isMobile ? 2400 : 1800));
      const alpha = t < 0.15 ? (t/0.15) : (t > 0.85 ? ((1-t)/0.15) : 1);
      ctx.globalAlpha = clamp(alpha, 0, 1);

      const pad = 16;
      const w = Math.min(rect2.width - pad*2, 760);
      const h = Math.max(86, Math.min(140, rect2.height * 0.18));
      const x = (rect2.width - w)/2;
      const y = Math.max(18, rect2.height * 0.10);

      ctx.fillStyle = rgba(BG, 0.92);
      ctx.strokeStyle = rgba(GRID, 0.95);
      ctx.lineWidth = 1;

      ctx.beginPath();
      // rounded overlay box
      const rr = Math.min(18, h/2);
      ctx.moveTo(x+rr, y);
      ctx.arcTo(x+w, y, x+w, y+h, rr);
      ctx.arcTo(x+w, y+h, x, y+h, rr);
      ctx.arcTo(x, y+h, x, y, rr);
      ctx.arcTo(x, y, x+w, y, rr);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const titleSize = clamp(rect2.width * 0.050, 22, 46);
      ctx.fillStyle = 'rgba(10,10,10,0.92)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${titleSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.fillText('You Reached Level 20!', rect2.width/2, y + h/2);

      ctx.restore();
    }

    if (current && current.state === 'gameover') {
      overlayWash(0.62);

      ctx.save();
      ctx.setTransform(DPR,0,0,DPR,0,0);

      const rect2 = canvas.getBoundingClientRect();

      const titleSize = clamp(rect2.width * 0.065, 28, 64);
      const subSize   = clamp(rect2.width * 0.024, 14, 22);

      ctx.fillStyle = 'rgba(10,10,10,0.92)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // ONLY change here: reduced boldness vs your last version
      ctx.font = `700 ${titleSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.fillText('Out of Tolerance', rect2.width/2, rect2.height/2 - titleSize*0.15);

      ctx.font = `600 ${subSize}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.fillStyle = 'rgba(10,10,10,0.62)';
      ctx.fillText('Tap/click or press Space to try again', rect2.width/2, rect2.height/2 + titleSize*0.55);

      ctx.restore();
    }
  }

  function drawGrid() {
    const step = 40;
    ctx.save();

    ctx.strokeStyle = rgba(GRID, 0.95);
    ctx.lineWidth = 0.5; // requested 0.5px thickness (in logical space; looks right after scaling)

    const y0 = -cam;
    const y1 = -cam + LOGICAL_H;
    const startY = Math.floor((y0 - 200) / step) * step;
    const endY   = Math.ceil((y1 + 200) / step) * step;

    for (let y = startY; y <= endY; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(LOGICAL_W, y);
      ctx.stroke();
    }

    for (let x = 0; x <= LOGICAL_W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, y0 - 200);
      ctx.lineTo(x, y1 + 200);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawSlab(x, y, w, h, alpha = 1, level = 0) {
  ctx.save();

  const fillHex = (level >= 21) ? BLUE_2 : BLUE_1;

  // 3D shading: vertical gradient + subtle top highlight + subtle bottom shadow
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0.00, rgba(lighten(fillHex, 0.18), 1.00 * alpha)); // brighter top
  g.addColorStop(0.45, rgba(fillHex,               0.92 * alpha)); // base
  g.addColorStop(1.00, rgba(darken(fillHex,  0.12), 0.92 * alpha)); // darker bottom

  roundRectPath(x, y, w, h, RADIUS);

  // Fill with gradient (no stroke/border)
  ctx.fillStyle = g;
  ctx.fill();

  // Top “sheen” highlight
  ctx.globalAlpha = 0.22 * alpha;
  const inset = 2.0;
  const sheenH = Math.max(4, h * 0.35);
  roundRectPath(x + inset, y + inset, w - inset * 2, sheenH, Math.max(2, RADIUS - 6));
  ctx.fillStyle = rgba("#ffffff", 1);
  ctx.fill();

  // Bottom shadow band
  ctx.globalAlpha = 0.10 * alpha;
  const shadowH = Math.max(4, h * 0.28);
  roundRectPath(x + inset, y + h - shadowH - inset, w - inset * 2, shadowH, Math.max(2, RADIUS - 6));
  ctx.fillStyle = rgba("#000000", 1);
  ctx.fill();

  ctx.restore();
}

  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  fitCanvasToCSS();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
